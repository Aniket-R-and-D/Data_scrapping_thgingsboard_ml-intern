# configs/release.yaml — R6 release configuration (Stage F).
#
# This file makes the safe operational path explicit. Any change to the
# safety-critical flags below must be reviewed; the startup check
# (src/tickets/startup_check.py) fails closed when they are violated.
release_name: "r5-reliability-recovery-stage-f"
release_date_utc: "2026-10-14"
policy_version: "ticket-policy-v1"
validator_version: "stage-c-field-validator-v1"

operational_defaults:
  # The deterministic typed ticket renderer is the default (and only
  # approved) production ticket path.
  ticket_renderer: "enabled"
  # The fine-tuned Qwen model is experimental commentary only. Default OFF.
  experimental_llm_enabled: false
  # Telemetry handling: read-only. No writes to ThingsBoard.
  telemetry_mode: "read-only"
  # All effectful outputs are disabled.
  alarm_creation: "disabled"
  dispatch: "disabled"
  notifications: "disabled"

model_versions:
  lightgbm_outage_predictor:
    path: "models/outage_predictor/remediated_lightgbm_clean.joblib"
    sha256: "799fae217485a0b56b340802171329d816e557661f43591be62511b155d2e5bf"
    role: "24-hour outage probability prediction (Platt-calibrated)"
  platt_calibrator:
    path: "models/outage_predictor/remediated_platt_calibrator.joblib"
    sha256: "0958ce80bb3407cca838d87c2c3e28efb83aad601e21cb4c18de463bd6eddbed"
    role: "probability calibration"
  # Experimental only — recorded for traceability, never loaded by default.
  remediated_qwen_merged:
    path: "models/qwen_reasoning_outage_predictor/remediated_final_model/model.safetensors"
    sha256: "be45761a2a66ed5dc5911009a1c3784af1d2d4dc5b392b9343b76cdbfe58e051"
    role: "experimental commentary only (default OFF)"
  remediated_qwen_lora_adapter:
    path: "models/qwen_reasoning_outage_predictor/remediated_lora_adapter/adapter_model.safetensors"
    sha256: "db16593c3500c4d09c5dd4bfb4aae448a6ca91856eaf5db25d6d314681843438"
    role: "experimental LoRA adapter source (default OFF)"

evaluation_manifests:
  train:
    manifest: "data/eval/manifest_train.json"
    manifest_sha256: "a8a3c92e2f73324f47f04ddc929438e10ae25ee97071e169a7e9585e97b17e4e"
    data_sha256: "b5afcf84e873031387ea21dd3be726f1b829b79570cd8f7193d5b602fc5eadbe"
  future_known_devices:
    manifest: "data/eval/manifest_future_known_devices.json"
    manifest_sha256: "7e8927dd4fe51d598407ff367853758a3fbc680c8bb4ed748a5e888e8097b72c"
    data_sha256: "54e224628cccd738e845d1bddc3477eb70fce2a68205200a8da5ed8027429ace"
  unseen_devices:
    manifest: "data/eval/manifest_unseen_devices.json"
    manifest_sha256: "6594db4569235fe538a19b6eda855d3c77b4a688c2f7a8fbf9efdffe593183c5"
    data_sha256: "0338742c77f0be7040360373e18292868b6377b4fc928b2f160efc186dbcec46"

fail_closed_rules:
  - "Missing required policy fields (policy_version, validator_version, operational_defaults) -> FAIL."
  - "Model artifact SHA-256 mismatch vs this file -> FAIL."
  - "Evaluation manifest or data-file SHA-256 mismatch vs this file -> FAIL."
  - "experimental_llm_enabled=true without explicit operator override -> FAIL."
  - "dispatch, alarm_creation, or notifications enabled without explicit operator override -> FAIL."
  - "telemetry_mode other than read-only without explicit operator override -> FAIL."
